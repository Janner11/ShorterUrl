plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.3'
    id 'com.github.johnrengelman.shadow' version '8.1.1' // ← NECESARIO para usar shadowJar
}

application {
    mainClass = 'edu.pucmm.Main'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Web Framework y utilidades
    implementation 'io.javalin:javalin:6.4.0'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.mongodb:mongodb-driver-sync:5.3.0'
    implementation("com.google.code.gson:gson:2.13.0")
    implementation 'com.auth0:java-jwt:3.19.2'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'org.mindrot:jbcrypt:0.4'

    // XML / JAXB / JAX-WS
    implementation 'javax.xml.ws:jaxws-api:2.3.1'
    implementation 'com.sun.xml.ws:jaxws-rt:2.3.5' // ← Evita repetir jaxws-rt
    implementation 'com.sun.xml.bind:jaxb-impl:2.3.5'
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'javax.activation:javax.activation-api:1.2.0'

    // gRPC y Protobuf
    implementation 'io.grpc:grpc-netty:1.50.2'
    implementation 'io.grpc:grpc-protobuf:1.50.2'
    implementation 'io.grpc:grpc-stub:1.50.2'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.21.12'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.55.1'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}


// Configuración para ShadowJar (Jar ejecutable)
shadowJar {
    archiveBaseName.set('app')
    archiveClassifier.set('')
    archiveVersion.set('')
}

// Para Heroku (si usas ShadowJar)
tasks.register('stage') {
    dependsOn shadowJar
}
shadowJar {
    mergeServiceFiles()  // Esto fusiona archivos de servicios si es necesario
    manifest {
        attributes(
                'Main-Class': 'edu.pucmm.Main'  // Asegúrate de que tu clase principal esté configurada aquí
        )
    }
}


test {
    useJUnitPlatform()
}