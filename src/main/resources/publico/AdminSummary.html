<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumen de URLs - Administrador</title>
  <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
  <style>
    :root {
        --main-bg: #001326;
        --card-bg: #001a33;
        --border-color: #003366;
        --accent-color: #4d8ebd;
        --text-color: #c0d6ff;
    }

    body {
        font-family: "Times New Roman", serif;
        background-color: var(--main-bg);
        color: var(--text-color);
        margin: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        border: 2px solid var(--border-color);
        margin-top: 20px;
    }

    th, td {
        padding: 12px;
        border: 1px solid var(--border-color);
        text-align: left;
    }

    th {
        background-color: var(--card-bg);
        color: var(--accent-color);
        font-weight: bold;
    }

    tr:nth-child(even) {
        background-color: var(--card-bg);
    }

    tr:hover {
        background-color: #00264d;
    }

    .center {
        text-align: center;
    }

    .qr-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
    }

    a {
        color: var(--accent-color);
        text-decoration: none;
    }

    a:hover {
        color: var(--text-color);
        text-decoration: underline;
    }

    h1 {
        color: var(--accent-color);
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 10px;
    }
  </style>
</head>
<body>

<h1>Resumen de URLs - Administrador</h1>
<table id="urlTable">
  <thead>
  <tr>
    <th>URL Original</th>
    <th>URL Corta</th>
    <th>Accesos</th>
    <th>Fecha de Creación</th>
    <th>QR</th>
  </tr>
  </thead>
  <tbody>
  <!-- Las filas se agregarán dinámicamente aquí -->
  </tbody>
</table>

<script>
  async function obtenerResumenUrlsAdmin() {
      try {
          let response = await fetch('/listUrls', {
              method: 'GET',
              headers: {
                  'Authorization': 'Bearer ' + localStorage.getItem('token')
              }
          });

          if (response.ok) {
              const urls = await response.json();
              const tableBody = document.querySelector('#urlTable tbody');
              tableBody.innerHTML = '';

              urls.forEach(url => {
                  const row = document.createElement('tr');

                  const qrContainer = document.createElement('td');
                  const qrElement = document.createElement('div');
                  qrContainer.classList.add('qr-container');
                  qrContainer.appendChild(qrElement);

                  new QRCode(qrElement, {
                      text: url.urlCorta,
                      width: 100,
                      height: 100,
                      colorDark: "#c0d6ff",  // Color claro para el QR
                      colorLight: "transparent",  // Fondo transparente
                  });

                  row.innerHTML = `
                      <td>${url.urlOriginal}</td>
                      <td><a href="${url.urlCorta}" target="_blank">${url.urlCorta}</a></td>
                      <td class="center">${url.accesos}</td>
                      <td>${new Date(url.fechaCreacion).toLocaleString()}</td>
                  `;

                  row.appendChild(qrContainer);
                  tableBody.appendChild(row);
              });
          } else {
              alert('No se pudieron cargar las URLs.');
          }
      } catch (error) {
          console.error('Error al obtener las URLs:', error);
      }
  }

  document.addEventListener('DOMContentLoaded', obtenerResumenUrlsAdmin);
</script>

</body>
</html>
